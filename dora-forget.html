<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>多拉忘記大挑戰</title><link rel="stylesheet" href="dora-forget.css"><link rel="stylesheet" href="arcade-fx.css?v=1"></head><body><main><header><a href="index.html">← 遊戲間</a><button id="motion" aria-pressed="false">特效：開</button></header><p class="eyebrow">DORA / 記憶離線，甩鍋上線</p><h1>多拉忘記大挑戰</h1><p class="intro">先記三件事，再看口供飛多遠。記錯沒關係，鍋子先不要飛！</p><div class="dashboard"><span id="round">準備開庭</span><span id="score">記對 0</span><span id="chaos">荒謬火花 0</span></div><section class="stage" id="stage" aria-label="卡通舞台"><div class="stars" aria-hidden="true">✦　☁　✧</div><div class="targets" aria-hidden="true"><span><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="55" r="32" fill="#fff4cd" stroke="#594374" stroke-width="5"/><path d="M50 32v25l17 9M20 17L8 30m72-13 12 13M25 84l-5 9m55-9 5 9" fill="none" stroke="#594374" stroke-width="6"/></svg><small>鬧鐘</small></span><span><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><ellipse cx="50" cy="60" rx="18" ry="28" fill="#db684b"/><path d="M38 50L20 35m42 15 18-15M42 32l-8-17m24 17 8-17M35 70l-15 8m45-8 15 8" stroke="#ab4438" stroke-width="5"/><path d="M14 12q-15 25 10 28Q40 15 24 8l-4 16zM86 12q15 25-10 28Q60 15 76 8l4 16z" fill="#db684b"/><circle cx="44" cy="39" r="3"/><circle cx="56" cy="39" r="3"/><path d="M40 63h20m-20 9h20m-18 9h16" stroke="#ab4438" stroke-width="3"/></svg><small>龍蝦</small></span><span><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="27" fill="#be8bcc"/><ellipse cx="50" cy="50" rx="47" ry="12" transform="rotate(-25 50 50)" fill="none" stroke="#765494" stroke-width="7"/><circle cx="43" cy="43" r="3"/><circle cx="57" cy="43" r="3"/></svg><small>宇宙</small></span></div><div class="actor" aria-hidden="true"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M22 96q-7-45 28-45t28 45" fill="#78548e"/><circle cx="50" cy="34" r="23" fill="#f2be9f"/><path d="M25 34Q16 3 50 4t25 30L62 20 35 23z" fill="#47334c"/><circle cx="42" cy="35" r="2.5"/><circle cx="58" cy="35" r="2.5"/><path d="M43 46q7 6 14 0M25 70L8 48m67 22 17-22" fill="none" stroke="#47334c" stroke-width="5"/><text x="76" y="25" font-size="25" fill="#78548e">?</text></svg></div><div id="pot" aria-hidden="true"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M65 68l25 25" stroke="#453449" stroke-width="13" stroke-linecap="round"/><circle cx="40" cy="42" r="34" fill="#453449"/><circle cx="40" cy="42" r="24" fill="#f3b964"/><circle cx="40" cy="42" r="12" fill="#fff4c6"/></svg></div><div id="burst" aria-hidden="true"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M50 2l9 29 30-17-13 30 24 12-29 8 8 30-26-20-22 23 2-32L2 61l26-18L14 16l28 14z" fill="#ffb948" stroke="#a75b35" stroke-width="3"/></svg></div><p id="bubble">我的記憶沒有錯，是現實沒同步。</p></section><section data-fx="draw" class="panel" aria-labelledby="heading"><h2 id="heading" tabindex="-1">歡迎來到記憶甩鍋片場</h2><div id="content"><p>每回合：看道具卡 → 蓋起來憑記憶作答 → 揭曉紀錄 → 選目標發射甩鍋，或讓鍋子回家。</p><p>沒有倒數，可以慢慢記。16 幕完整場或 4 幕快閃；點選與鍵盤都能玩。</p></div><div id="choices"></div><p id="feedback" role="status" aria-live="polite"></p><div id="actions"><button id="short">快閃 4 幕</button><button id="full">完整 16 幕</button></div></section><button id="reset" hidden>重新開場</button><p class="fine">多拉是本片卡通角色；所有事件與台詞皆為原創鬧劇，不是真人紀錄。記憶分數與荒謬火花只屬於本局，不評定人格。不儲存、不上傳。</p></main><script src="dora-forget.js"></script><script src="arcade-fx.js?v=1"></script></body></html>
