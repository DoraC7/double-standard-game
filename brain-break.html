<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>腦力補給站｜Dora playground</title><meta name="description" content="18 道原創益智題：觀察規律、條件推理與空間想像。不限時，作答後看解析，可以再試一次。"><link rel="stylesheet" href="brain-break.css"><script src="brain-break-engine.js" defer></script><script src="brain-break.js" defer></script><link rel="stylesheet" href="arcade-fx.css?v=20261028-1"><script src="arcade-fx.js?v=20261028-1" defer></script></head>
<body><main><header><a href="index.html">← 回遊戲間</a><span>DORA PLAYGROUND / BRAIN BREAK</span></header>
<section class="hero"><div><p class="eyebrow">給好奇心一點補給</p><h1>腦力<span>補給站 ✳</span></h1><p>看出規律、串起條件、轉個角度。<br>不搶時間，想通比猜中更有趣。</p></div><img src="brain-break.svg" width="240" height="200" alt=""></section>
<section id="intro" class="panel"><h2>今天想動哪一種腦筋？</h2><label for="mode">練習範圍</label><select id="mode"><option value="short">輕鬆一輪 · 6 題（每類 2 題）</option><option value="all">完整補給 · 18 題</option><option value="pattern">規律觀察 · 6 題</option><option value="logic">條件推理 · 6 題</option><option value="space">空間想像 · 6 題</option></select><p>先選答案，再按「確認答案」；還沒想通也能先看解析。可重試，但會保留第一次作答結果。</p><button id="start" class="primary" type="button">補給開始 →</button><p class="small">原創休閒益智題，不是智力測驗或能力評鑑。沒有倒數、帳號或排行榜；作答只留在本分頁，重新整理即清空，不儲存、不上傳。</p></section>
<section id="play" hidden><div class="progress-line"><p id="round"></p><span id="score"></span></div><progress id="progress" max="6" value="0" aria-label="已作答題數"></progress><article class="panel"><p id="topic" class="eyebrow"></p><h2 id="question-title" tabindex="-1"></h2><div id="puzzle" class="puzzle"></div><p id="prompt"></p><div id="options" class="options" role="group" aria-labelledby="prompt"></div><div class="actions"><button id="confirm" class="primary" type="button" disabled>確認答案</button><button id="unsure" type="button">還沒想通，先看解析</button></div><div id="feedback" class="feedback" role="status" hidden></div><div class="actions"><button id="retry" type="button" hidden>再試一次 ↻</button><button id="next" class="primary" type="button" hidden>下一題 →</button></div></article><button id="leave" type="button">結束這輪，返回選單（不保留本輪紀錄）</button></section>
<section id="result" class="panel" data-fx="finish" hidden><p class="eyebrow">補給完成</p><h2 id="result-title" tabindex="-1">把想通的方法帶走。</h2><p id="summary"></p><p>首次結果與重試結果分開記錄；題數不是智力分數。展開每題，看看還能帶走哪個方法。</p><div id="review"></div><button id="restart" class="primary" type="button">再選一輪 →</button></section><footer>想一想，也讓腦袋喘口氣。 🦞 <a href="index.html">回遊戲間 ↗</a></footer><noscript><p>請啟用 JavaScript 來玩互動益智題。</p></noscript></main></body></html>
