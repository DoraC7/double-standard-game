<body><main>
<header><div class="logo">⚖️ 雙標鑑定所</div><div class="badge" id="header-badge">限時抓包版</div></header>
<section class="screen active center" id="intro"><div class="hero-icon">🕵️‍♀️</div><div class="eyebrow">雙 標 怪 出 沒 注 意</div><h1 class="hero">雙標<br>大挑戰</h1><p class="lead">24 個隨機案件、三大關卡。限時蓋章抓包，連擊加分；誤判會扣血，Boss 題更難！</p><div class="panel intro-panel"><label for="player">鑑定師名字</label><input id="player" maxlength="16" placeholder="例如：多拉" autocomplete="nickname"><button class="btn yellow wide" id="start">進入鑑定所 →</button><div class="rules"><div class="rule">⏱️ 限時判案</div><div class="rule">🔥 連擊加倍</div><div class="rule">❤️ 失誤扣血</div></div><div class="note">點按或左右滑卡片作答。左＝雙標，右＝情況不同。純前端，不收集資料。</div></div></section>
<section class="screen" id="game"><div class="hud"><div><small>案件</small><div class="value" id="round">1 / 24</div></div><div><small>分數</small><div class="value" id="score">0</div></div><div><small>生命</small><div class="hearts" id="hearts">♥♥♥♥♥</div></div></div><div class="progress"><div id="progress"></div></div><div class="timer-wrap"><div class="timer-track"><div class="timer-fill" id="timer-fill"></div></div><div class="timer-number" id="timer-number">12</div></div><div class="panel" id="case-panel"><div class="case-head"><span class="chapter" id="chapter">第一關・熱身抓包</span><span class="combo" id="combo">COMBO ×0</span></div><h2 class="title" id="title"></h2><div class="compare" id="swipe-zone"><div class="card a"><strong>🩷 我對自己說</strong><span id="text-a"></span></div><div class="card b"><strong>🩵 我對別人說</strong><span id="text-b"></span></div></div><div class="vs">兩把尺，還是有差別？</div><div class="stamps" id="stamps"><button class="btn pink" id="double">🚨 雙標！</button><button class="btn cyan" id="different">✅ 情況不同</button></div><div class="tools-row"><button class="tool-btn" id="pause">❄️ 凍結 5 秒 <span id="pause-left">×2</span></button><button class="tool-btn" id="clue-btn">🔎 線索 <span id="clue-left">×2</span></button></div><div class="clue" id="clue" hidden></div><div class="flash" id="flash" role="status"></div></div><div class="footer">鍵盤 A / ←：雙標　D / →：情況不同</div></section>
<section class="screen center" id="intermission"><div class="panel stage-panel"><div class="stage" id="stage-emoji">⚡️</div><div class="eyebrow">關 卡 完 成</div><h2 class="stage-title" id="stage-title"></h2><p class="stage-text" id="stage-text"></p><div class="stage-stats"><span id="stage-score"></span><span id="stage-hearts"></span></div><button class="btn yellow wide" id="continue">下一關 →</button></div></section>
<section class="screen center" id="result"><div class="stage" id="result-emoji">🏆</div><div class="eyebrow" id="result-label">鑑 定 完 成</div><div class="result-score" id="final-score"></div><h2 class="result-rank" id="rank"></h2><p class="lead" id="summary"></p><div class="panel stage-panel"><div id="result-detail"></div><div class="result-actions"><button class="btn yellow" id="again">再來一局 ↻</button><button class="btn ghost" id="share">分享戰績 ↗</button></div><div class="review" id="review"></div></div><div class="footer">每局隨機抽題・你的作答只留在這個頁面</div></section>
</main><script>
// Each case: title, self, other, isDoubleStandard, explanation, clue. The three stages draw from separate pools.
const cases=[
['已讀不回','我忙三小時不回：真的在忙。','你忙三小時不回：一定不在乎我。',1,'同樣的狀況，換人就換評價。','兩邊都忙了三小時。'],
['捷運誤點','我因捷運誤點遲到五分鐘：情有可原。','你因同班捷運誤點五分鐘：沒時間觀念。',1,'時間、原因相同，標準卻翻面。','原因和時長都相同。'],
['薯條守則','我吃你薯條前要先問。','你吃我薯條前也要先問。',0,'規則對雙方相同，公平！','兩邊的要求一模一樣。'],

['學習新工具','我上班時間學新工具，能改善流程。','你上班時間學同款工具、做同樣改善，我說你摸魚。',1,'用途與成果都一樣，卻只准自己做。','成果相同。'],
['先講界線','我不想被公開生日日期，所以請你別貼。','你願意公開自己的生日，我不阻止。',0,'各人對自身資訊有不同界線，很合理。','決定的是各自的資訊。'],

['搭車回家','我喝酒了，所以叫車回家。','你沒喝酒，選擇自己開車回家。',0,'酒精會改變風險，選擇不同合理。','有沒有喝酒？'],

['外套借誰','我怕冷，向你借外套。','你也怕冷，向我借外套，我說你太嬌氣。',1,'同樣感受，不因人而異。','兩邊都怕冷。'],

const $=id=>document.getElementById(id), TOTAL=24, STAGE=8;let deck=[],idx=0,score=0,hearts=5,combo=0,correct=0,name='鑑定師',left=12,clock=null,locked=false,pauses=2,clues=2,hintUsed=false,history=[];let maxTime=12,roundToken=0;
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===id));window.scrollTo(0,0)}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){name=$('player').value.trim()||'鑑定師';deck=shuffle(cases.filter(q=>q[3]===1)).slice(0,13).concat(shuffle(cases.filter(q=>q[3]===0)).slice(0,11));deck=shuffle(deck);idx=0;score=0;hearts=5;combo=0;correct=0;pauses=2;clues=2;history=[];$('header-badge').textContent=name+' 的鑑定所';show('game');render()}
function render(){clearInterval(clock);roundToken++;locked=false;hintUsed=false;let q=deck[idx],stage=Math.floor(idx/STAGE);maxTime=stage===2&&idx%STAGE===7?8:stage===1?11:12;left=maxTime;$('round').textContent=`${idx+1} / ${TOTAL}`;$('score').textContent=score.toLocaleString();$('hearts').textContent='♥'.repeat(hearts)+'♡'.repeat(5-hearts);$('progress').style.width=(idx/TOTAL*100)+'%';$('chapter').textContent=stage===0?'第一關・熱身抓包':stage===1?'第二關・雙標迷宮':idx%STAGE===7?'👑 最終 Boss 案件':'第三關・終極審判';$('combo').textContent=`COMBO ×${combo}`;$('title').textContent=q[0];$('text-a').textContent=q[1];$('text-b').textContent=q[2];$('flash').className='flash';$('flash').textContent='';$('clue').hidden=true;$('clue').textContent='';$('pause-left').textContent='×'+pauses;$('clue-left').textContent='×'+clues;$('pause').disabled=pauses===0;$('clue-btn').disabled=clues===0;$('stamps').style.visibility='visible';tick();clock=setInterval(()=>{left=Math.max(0,left-.1);tick();if(left<=0)resolve(null)},100)}
function tick(){$('timer-fill').style.width=(left/maxTime*100)+'%';$('timer-fill').classList.toggle('danger',left<=3);$('timer-number').textContent=Math.ceil(left)}
function resolve(value){if(locked)return;locked=true;clearInterval(clock);const q=deck[idx],ok=value===Boolean(q[3]);if(ok){correct++;combo++;score+=Math.round((100+left*12)*Math.min(combo,4));if(combo>0&&combo%5===0)hearts=Math.min(5,hearts+1)}else{combo=0;hearts=Math.max(0,hearts-1)}history.push({title:q[0],ok,answer:q[3]?'雙標':'情況不同',why:q[4]});$('score').textContent=score.toLocaleString();$('hearts').textContent='♥'.repeat(hearts)+'♡'.repeat(5-hearts);$('combo').textContent=`COMBO ×${combo}`;$('stamps').style.visibility='hidden';$('flash').className='flash show '+(ok?'win':'lose');$('flash').textContent=(ok?'💥 抓到了！':value===null?'⏰ 時間到！':'💔 誤判！')+' '+q[4]+(ok&&combo%5===0?' 連擊回復一顆心！':'');setTimeout(advance,1250)}
function advance(){idx++;if(hearts===0||idx===TOTAL){finish();return}if(idx%STAGE===0){const stage=idx/STAGE;$('stage-emoji').textContent=stage===1?'⚡️':'👑';$('stage-title').textContent=stage===1?'熱身結束，難度升級！':'Boss 戰快到了！';$('stage-text').textContent=stage===1?'下一關時間更短。保持連擊，第 5 次連擊可回復一顆心！':'最後 8 案，終局 Boss 只有 8 秒。凍結道具現在用也不遲！';$('stage-score').textContent=`${score.toLocaleString()} 分`;$('stage-hearts').textContent=`${hearts} 顆心`;show('intermission')}else render()}
function finish(){clearInterval(clock);const won=idx===TOTAL;let rank=correct>=22?'雙標終結者':correct>=18?'黃金鑑定師':correct>=13?'抓包見習生':'心軟陪審員';$('result-emoji').textContent=won?'🏆':'💫';$('result-label').textContent=won?'全 關 通 過':'本 局 結 束';$('final-score').textContent=score.toLocaleString()+' 分';$('rank').textContent=rank;$('summary').textContent=`${name}，你判對 ${correct} / ${history.length} 案${won?'，成功守住鑑定所！':'。別氣餒，再來一局換一批案件！'}`;$('result-detail').textContent=`最高連擊挑戰，還剩 ${hearts} 顆心。`;const misses=history.filter(x=>!x.ok);$('review').replaceChildren();if(misses.length){let h=document.createElement('b');h.textContent='本局漏網案件';$('review').append(h);misses.forEach(x=>{let d=document.createElement('div');d.textContent=`${x.title}：${x.answer}。${x.why}`;$('review').append(d)})}else $('review').textContent='全答對！雙標怪已經嚇到逃跑。';$('header-badge').textContent='挑戰完成';show('result')}
$('start').onclick=start;$('player').onkeydown=e=>{if(e.key==='Enter')start()};$('double').onclick=()=>resolve(true);$('different').onclick=()=>resolve(false);$('pause').onclick=()=>{if(locked||pauses<=0)return;pauses--;$('pause-left').textContent='×'+pauses;$('pause').disabled=pauses===0;clearInterval(clock);const token=roundToken;$('timer-number').textContent='❄️';setTimeout(()=>{if(!locked&&token===roundToken){tick();clock=setInterval(()=>{left=Math.max(0,left-.1);tick();if(left<=0)resolve(null)},100)}},5000)};$('clue-btn').onclick=()=>{if(locked||clues<=0||hintUsed)return;clues--;hintUsed=true;$('clue-left').textContent='×'+clues;$('clue-btn').disabled=true;$('clue').textContent='🔎 '+deck[idx][5];$('clue').hidden=false};$('continue').onclick=()=>{show('game');render()};$('again').onclick=start;document.addEventListener('keydown',e=>{if(!$('game').classList.contains('active')||locked)return;if(e.key==='a'||e.key==='A'||e.key==='ArrowLeft')resolve(true);if(e.key==='d'||e.key==='D'||e.key==='ArrowRight')resolve(false)});let touchX=null;$('swipe-zone').addEventListener('touchstart',e=>{touchX=e.changedTouches[0].screenX},{passive:true});$('swipe-zone').addEventListener('touchend',e=>{if(touchX===null||locked)return;let dx=e.changedTouches[0].screenX-touchX;touchX=null;if(Math.abs(dx)>65)resolve(dx<0)},{passive:true});$('share').onclick=async()=>{let msg=`${name} 在《雙標大挑戰・限時抓包》抓對 ${correct} 案，拿到 ${score.toLocaleString()} 分！換你挑戰：${location.href}`;try{if(navigator.share){await navigator.share({title:'雙標大挑戰',text:msg});return}await navigator.clipboard.writeText(msg);$('share').textContent='已複製 ✓';setTimeout(()=>$('share').textContent='分享戰績 ↗',2000)}catch(e){if(e.name!=='AbortError')prompt('複製戰績：',msg)}};
</script></body></html>
