<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>換位鎮：巡場新版</title><style>body{margin:0;background:#111b2b;color:#fff;font:17px system-ui}header{padding:16px;display:flex;gap:20px;flex-wrap:wrap}main{max-width:950px;margin:auto;padding:12px}#world{position:relative;height:330px;background:linear-gradient(145deg,#27465c,#253047);border:3px solid #66869e;border-radius:20px;overflow:hidden} .room{position:absolute;border:2px dashed #8297a8;padding:12px;border-radius:12px;color:#cadce6}.actor{position:absolute;border:0;background:none;font-size:36px;cursor:pointer;transition:left .3s,top .3s}.actor span{display:block;font-size:13px;color:white;background:#182638;padding:4px;border-radius:6px}#player{pointer-events:none;z-index:2}button{padding:14px;border-radius:12px;border:1px solid #8ec6d4;background:#28495b;color:white;font:inherit;cursor:pointer}button:disabled{opacity:.5}button:hover{background:#39738b}#panel{padding:20px;background:#1d3045;border-radius:16px;margin-top:16px}#options{display:grid;gap:10px}#bar{height:8px;background:#f5ba55;transition:width .15s}#log{color:#c0d5df;font-size:14px}.flip{animation:flip .6s}@keyframes flip{50%{transform:rotateY(90deg)}}.pop{position:absolute;animation:float 1s forwards;color:#ffcc66;font-size:25px;pointer-events:none}@keyframes float{to{transform:translateY(-85px);opacity:0}}#flash{position:absolute;inset:0;pointer-events:none}.pulse{animation:pulse .6s}@keyframes pulse{50%{background:#e5ac6433}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}button:focus-visible,a:focus-visible{outline:3px solid #ffde7e;outline-offset:3px}#panel{box-shadow:0 20px 50px #0005}#world{background:radial-gradient(circle at 20% 10%,#526a6e,#253047 70%)}#options button{line-height:1.5;text-align:left}#hud{background:#ffffff18;border-radius:12px;padding:8px 12px}@media(max-width:500px){header{gap:8px}#world{height:290px}.room{font-size:12px;padding:7px}.actor{font-size:28px}#panel{padding:16px}}</style><header><b>🎭 換位鎮：巡場新版</b><span id="hud"></span><button id="sound" aria-pressed="false">音效：關</button><button id="timer-toggle" aria-pressed="true">倒數：開</button></header><main><div id="world"><div class="room" style="left:3%;top:15%;width:24%;height:170px">☕ 聚會區</div><div class="room" style="left:36%;top:15%;width:24%;height:170px">💼 辦公室</div><div class="room" style="left:69%;top:15%;width:24%;height:170px">🏠 共用空間</div><div id="player" class="actor" style="left:45%;top:250px">🧑‍🚀<span>你</span></div><div id="flash"></div></div><div id="panel" aria-live="polite"><div id="bar"></div><h2 id="title"></h2><p id="story"></p><div id="options"></div><p id="log"></p></div><p><a href="./" style="color:#ffe27b">返回原版</a></p><p>玩法：走近有❗的人處理事件。先替別人訂規則，隔幾案換你承受。方向鍵／WASD 或點地板移動，靠近按 E；也可按「帶我去」。同條件前後選擇才比較，超時不替你亂選；可關閉倒數。這是娛樂原型，不是人格測驗。</p></main><script src="scenarios.js"></script><script src="choices.js"></script><script>
const $=s=>document.querySelector(s),world=$('#world');let queue=[],round=0,records=[],phase='walk',time=20,sound=false,audio,timerOn=true,roundTime=20;const count=5;let x=45,y=250;const names=['阿凱','小芸','雅婷'];let actors=[];
function beep(freq=500){if(!sound)return;audio??=new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=freq;g.gain.setValueAtTime(.06,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.15);o.start();o.stop(audio.currentTime+.16)}
$('#sound').onclick=()=>{sound=!sound;$('#sound').textContent='音效：'+(sound?'開':'關');$('#sound').setAttribute('aria-pressed',String(sound));beep()};
$('#timer-toggle').onclick=()=>{timerOn=!timerOn;$('#timer-toggle').textContent='倒數：'+(timerOn?'開':'關');$('#timer-toggle').setAttribute('aria-pressed',String(timerOn));if(phase==='choice'){time=roundTime;$('#bar').style.width='100%'}hud()};function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){const bank=shuffle([...scenarios]).slice(0,count);queue=[...bank.map((q,id)=>({q,id,self:false})),...shuffle(bank.map((q,id)=>({q,id,self:true})))];round=0;records=[];next()}
function hud(){ $('#hud').textContent=`事件 ${Math.min(round+1,queue.length)}/${queue.length} · ${phase==='choice'?(timerOn?time+' 秒':'休閒模式'):'探索中'}`}
function move(nx,ny){x=Math.max(0,Math.min(92,nx));y=Math.max(20,Math.min(275,ny));$('#player').style.left=x+'%';$('#player').style.top=y+'px'}
function near(){if(phase!=='walk'||!actors.length)return false;let a=actors[round%3];return Math.abs(x-a.x)<15&&Math.abs(y-a.y)<80}
world.onclick=e=>{if(e.target!==world&&!e.target.classList.contains('room'))return;let r=world.getBoundingClientRect();move((e.clientX-r.left)/r.width*100,e.clientY-r.top)};
document.addEventListener('keydown',e=>{if(phase!=='walk')return;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();let k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')move(x-5,y);if(k==='arrowright'||k==='d')move(x+5,y);if(k==='arrowup'||k==='w')move(x,y-20);if(k==='arrowdown'||k==='s')move(x,y+20);if(k==='e'&&near())talk()});
function next(){if(round>=queue.length)return finish();phase='walk';actors.forEach(a=>a.el.remove());actors=[];names.forEach((name,i)=>{let el=document.createElement('button');el.className='actor';let ax=12+i*33;el.style.left=ax+'%';el.style.top='125px';el.innerHTML=['🧑‍💼','👩‍🔧','👩‍💻'][i]+`<span>${i===round%3?'❗ ':''}${name}</span>`;world.append(el);actors.push({el,x:ax,y:125});el.onclick=()=>{move(ax,190);if(i===round%3)talk()}});$('#title').textContent=queue[round].self?'🎭 輪到你了，去接任務':'📬 新事件：有人需要你的決定';$('#story').textContent='到有❗的角色旁邊。每段對話開始後才計時，探索不扣時間。';$('#bar').style.width='100%';$('#options').innerHTML='<button id="go">帶我去 →</button>';$('#go').onclick=()=>{let a=actors[round%3];move(a.x,190);talk()};hud()}
function talk(){if(phase!=='walk')return;phase='choice';let t=queue[round];roundTime=time=Math.max(20,Math.min(40,Math.ceil((t.self?t.q.self:t.q.story).length/5)));$('#title').textContent=(t.self?'你成了當事人：':'你替別人決定：')+t.q.title;$('#story').textContent=t.self?t.q.self:t.q.story;$('#panel').classList.remove('flip');void $('#panel').offsetWidth;if(t.self){$('#panel').classList.add('flip');beep(250)}$('#log').textContent=t.self?'條件保持相同。請選你現在願意採用的安排。':'先訂下你願意採用的規則。';$('#options').innerHTML='';actionsFor(t.q).forEach((label,i)=>{let b=document.createElement('button');b.textContent=label;b.onclick=()=>choose(i);$('#options').append(b)});hud()}
function choose(answer){if(phase!=='choice')return;phase='result';let t=queue[round];records.push({...t,answer});beep(350+(answer??0)*180);let p=document.createElement('div');p.className='pop';p.style.left=x+'%';p.style.top=y+'px';p.textContent=answer===null?'棄權':'已記錄';world.append(p);setTimeout(()=>p.remove(),1100);$('#flash').classList.remove('pulse');void world.offsetWidth;$('#flash').classList.add('pulse');let prev=records.find(r=>r.id===t.id&&!r.self);$('#log').textContent=answer===null?'⏱ 超時：這回合棄權，不納入一致性比較。':t.self?(prev.answer===null?'前次棄權，這組不評分。':prev.answer===answer?'📏 前後採用同樣安排。':'📡 雷達記錄到同條件、不同選擇；結算再一起回看。'):'規則已記錄。稍後你會成為同一情境的當事人。';$('#options').innerHTML='<button id="next">繼續這一天 →</button>';$('#next').onclick=()=>{round++;next()};hud()}
function finish(){phase='end';let paired=queue.filter(t=>!t.self).map(t=>{let a=records.find(r=>r.id===t.id&&!r.self),b=records.find(r=>r.id===t.id&&r.self);return {q:t.q,a:a.answer,b:b.answer}});let valid=paired.filter(p=>p.a!==null&&p.b!==null),same=valid.filter(p=>p.a===p.b).length;$('#title').textContent='🌆 下班！你的選擇軌跡';$('#story').textContent=`${valid.length} 組可比較事件，${same} 組前後一致。`;$('#options').innerHTML='';paired.forEach(p=>{let d=document.createElement('p');let labels=actionsFor(p.q);d.textContent=`${p.q.title}｜替別人：${p.a===null?'棄權':labels[p.a]} → 輪到自己：${p.b===null?'棄權':labels[p.b]}`;$('#options').append(d)});let b=document.createElement('button');b.textContent='再上一天班';b.onclick=start;$('#options').append(b);$('#log').textContent='一致不等於合理；不同也需要看理由。這裡只呈現相同條件下的選擇變化。';$('#bar').style.width='100%';hud()}
setInterval(()=>{if(phase!=='choice'||!timerOn)return;time--;$('#bar').style.width=Math.max(0,time/roundTime*100)+'%';if(time<=5&&time>0)beep(700);hud();if(time<=0)choose(null)},1000);start();
</script></html>
