<section id="intro" class="screen active center"><div class="hero">你訂的規則<br>換你承受</div><p class="lead">先替別人訂規則。隔幾案，同樣的事落到你身上——你還願意照辦嗎？</p><div class="panel intro"><div class="rules"><span>⚖️ 訂 8 條規則</span><span>🔄 角色互換</span><span>🎲 隨機補給</span></div><p>每局從 40 個情境抽 8 個，換位後共 16 回合。你的規則會影響民心，也會在角色互換時扣自己的體力；臨時要求特例則會傷公信力。</p><button class="btn gold wide" id="start">開始當法官 →</button><p class="small">沒有標準人格答案；「一致性」只是這局選擇的娛樂指標。純前端，不收集資料。</p></div></section>
<section id="game" class="screen"><div class="hud"><div><small>民心</small><strong id="trust">8</strong></div><div><small>體力</small><strong id="energy">10</strong></div><div><small>公信力</small><strong id="cred">8</strong></div></div><div class="meter"><div id="bar"></div></div><div class="radar" id="radar">📡 雙標雷達：換位後啟動</div><div class="panel"><div class="phase" id="phase"></div><h1 class="case-title" id="title"></h1><p class="story" id="story"></p><p class="aside" id="aside"></p><div class="quote" id="quote" hidden></div><div class="notice" id="notice" hidden></div><div class="choice-list" id="choices"></div><div class="feedback" id="feedback" role="status"></div></div><div class="foot" id="round"></div></section>
<section id="event" class="screen center"><div class="panel" style="margin-top:35px"><div class="event">🎲</div><div class="phase">突 發 事 件</div><h2 id="event-title"></h2><p class="lead" id="event-story"></p><div class="choice-list" id="event-choices"></div></div></section>
<section id="result" class="screen center"><div class="hero">終局判決</div><h2 class="rank" id="rank"></h2><p class="lead" id="ending"></p><div class="result-grid"><div><b id="fair">0/8</b><small>守住原規則</small></div><div><b id="end-trust">0</b><small>民心</small></div><div><b id="end-energy">0</b><small>體力</small></div></div><div class="panel"><div class="review" id="review"></div><div class="actions"><button class="btn gold wide" id="again">換一批案件 ↻</button><button class="btn subtle wide" id="share">分享結局 ↗</button></div></div><p class="foot">一致性不等於善良；願意修正不合理的規則也很重要。</p></section>

const $=id=>document.getElementById(id);let chosen=[],laws=[],order=[],step=0,trust=8,energy=10,cred=8,kept=0,history=[],locked=false;
let soundOn=false,audioCtx=null;
function beep(freq=440){if(!soundOn)return;try{audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();let osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type='sine';osc.frequency.value=freq;gain.gain.setValueAtTime(.035,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.11);osc.connect(gain).connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+.12)}catch(e){soundOn=false;$('sound').textContent='🔇 音效關'}}
function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;let colors=['#ffe27b','#ff89b5','#85e8e9','#a98aff'];for(let i=0;i<25;i++){let bit=document.createElement('i');bit.className='confetti';bit.style.left=Math.random()*100+'vw';bit.style.background=colors[i%colors.length];bit.style.animationDelay=(Math.random()*.6)+'s';document.body.append(bit);setTimeout(()=>bit.remove(),3100)}}
$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊 音效開':'🔇 音效關';$('sound').setAttribute('aria-pressed',String(soundOn));beep(660)};
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function clamp(x){return Math.max(0,Math.min(10,x))}
function screen(id){document.querySelectorAll('.screen').forEach(el=>el.classList.toggle('active',el.id===id));window.scrollTo(0,0)}
function start(){chosen=shuffle(scenarios).slice(0,8);laws=Array(8).fill(null);order=shuffle([0,1,2,3,4,5,6,7]);step=0;trust=8;energy=10;cred=8;kept=0;history=[];$('radar').textContent='📡 雙標雷達：換位後啟動';screen('game');render()}
function options(items){let box=$('choices');box.replaceChildren();items.forEach(({emoji,title,detail,run,color})=>{let b=document.createElement('button');b.className='btn '+color;let icon=document.createElement('b');icon.textContent=emoji;let s=document.createElement('span');let strong=document.createElement('strong');strong.textContent=title;s.append(strong,document.createTextNode(detail));b.append(icon,s);b.onclick=run;box.append(b)})}
function update(){ $('trust').textContent=trust+'/10';$('energy').textContent=energy+'/10';$('cred').textContent=cred+'/10';$('bar').style.width=(step/16*100)+'%';$('round').textContent=`${step+1} / 16 ・ ${step<8?'立法階段':'換位階段'}`}
function render(){locked=false;let first=step<8;let slot=first?step:order[step-8],q=chosen[slot];screen('game');update();$('phase').textContent=first?'第一幕・你替別人訂規則':'第二幕・輪到你受用';$('title').textContent=q.title;$('story').textContent=first?q.story:q.self;$('aside').textContent=first?q.rule:'情境條件完全相同，只有主角換成你。';$('feedback').textContent='';$('notice').hidden=first;$('quote').hidden=first;if(first){options([
{emoji:'🌿',title:'放他一馬',detail:'零處罰。保留空間，但可能影響民心。',color:'blue',run:()=>setLaw(slot,0)},
{emoji:'🧹',title:'補救一下',detail:'道歉或做一份補償。',color:'gold',run:()=>setLaw(slot,1)},
{emoji:'⚡',title:'認真負責',detail:'完整補償並付出額外時間。',color:'pink',run:()=>setLaw(slot,2)}]);return}
let law=laws[slot];$('quote').hidden=false;$('quote').textContent=`你當時訂的規則：${['放他一馬','補救一下','認真負責'][law]}（代價 ${law} 格體力）`;$('notice').hidden=false;$('notice').textContent='同一把尺，現在量到你了。';options([
{emoji:'⚖️',title:'照原規則辦',detail:`付出 ${law} 格體力；維持公信力。`,color:'gold',run:()=>accept(slot)},
{emoji:'🎭',title:'我有例外啦',detail:`免付體力，但公信力下降 ${law+1}。`,color:'pink',run:()=>appeal(slot)}])}
function setLaw(slot,level){if(locked)return;locked=true;beep(520);let q=chosen[slot];laws[slot]=level;let delta=Math.abs(level-q.harm);trust=clamp(trust-delta);history.push({slot,level,kept:null});$('feedback').textContent=delta?`民心 −${delta}：旁人覺得這條規則${level<q.harm?'太輕':'太重'}。`:'民心不變：大家暫時接受這條規則。';nextSoon()}
function accept(slot){if(locked)return;locked=true;beep(680);let law=laws[slot];energy=clamp(energy-law);kept++;history.find(h=>h.slot===slot).kept=true;$('radar').textContent=`📡 雙標雷達：${kept}/${step-7} 條規則守住`; $('feedback').textContent=`你照辦了，體力 −${law}。規則一致。`;nextSoon()}
function appeal(slot){if(locked)return;locked=true;beep(240);let law=laws[slot];cred=clamp(cred-law-1);history.find(h=>h.slot===slot).kept=false;$('radar').textContent=`📡 雙標雷達：${kept}/${step-7} 條規則守住`; $('feedback').textContent=`你替自己開了特例，公信力 −${law+1}。`;nextSoon()}
function nextSoon(){Array.from($('choices').children).forEach(b=>b.disabled=true);update();setTimeout(()=>{step++;if(step===16)return finish();if(step===8||step===12){showEvent();return}render()},850)}
function showEvent(){screen('event');const first=step===8;const pool=first?[
 {title:'法庭中場休息',story:'換位審判前，只能選一項補給。',items:[['💪','休息一下','體力 +3',()=>energy=clamp(energy+3)],['🫶','聽聽大家說','民心 +2',()=>trust=clamp(trust+2)]]},
 {title:'神秘補給箱',story:'志工送來補給，但你只能帶走一樣。',items:[['🍱','補充便當','體力 +2',()=>energy=clamp(energy+2)],['📜','公開判例','公信力 +2',()=>cred=clamp(cred+2)]]}
]:[
 {title:'輿論突然翻盤',story:'大家開始討論你訂過的規則。',items:[['📣','公開說明','公信力 +2，體力 −1',()=>{cred=clamp(cred+2);energy=clamp(energy-1)}],['🤝','私下溝通','民心 +2',()=>trust=clamp(trust+2)]]},
 {title:'突擊記者會',story:'記者追問：你要顧面子，還是顧身體？',items:[['🎙️','正面回答','公信力 +2',()=>cred=clamp(cred+2)],['🛌','先休息再說','體力 +2，民心 −1',()=>{energy=clamp(energy+2);trust=clamp(trust-1)}]]}
];const event=pool[Math.floor(Math.random()*pool.length)];$('event-title').textContent=event.title;$('event-story').textContent=event.story;let box=$('event-choices');box.replaceChildren();event.items.forEach(([emoji,title,detail,fn],i)=>{let b=document.createElement('button');b.className='btn '+(i?'blue':'gold');let icon=document.createElement('b');icon.textContent=emoji;let span=document.createElement('span');let strong=document.createElement('strong');strong.textContent=title;span.append(strong,document.createTextNode(detail));b.append(icon,span);b.onclick=()=>{beep(600);fn();render()};box.append(b)})}
function finish(){let rank,ending;if(kept===8&&trust>=5){rank='同一把尺的法官';ending='你訂的規則自己也照辦，民心也守住了。這局很穩！'}else if(kept===8){rank='鐵面執行官';ending='你確實說到做到；只是某些規則讓旁人皺眉，下一局可以試著訂得更好。'}else if(cred<=3){rank='特例收藏家';ending='替自己開了不少後門，公信力快見底啦 😂'}else{rank='彈性審判長';ending='你有時改了口。是雙標，還是發現原本規則不合理？看看下面每案的紀錄。'}$('rank').textContent=rank;$('ending').textContent=ending;$('fair').textContent=kept+'/8';$('end-trust').textContent=trust+'/10';$('end-energy').textContent=energy+'/10';let review=$('review');review.replaceChildren();history.forEach(h=>{let p=document.createElement('p');p.textContent=`${chosen[h.slot].title}：你訂「${['放他一馬','補救一下','認真負責'][h.level]}」，輪到自己時${h.kept?'照辦':'要求特例'}。`;review.append(p)});screen('result');if(kept>=6)confetti()}
$('start').onclick=start;$('again').onclick=start;$('share').onclick=async()=>{let msg=`我在《雙標大挑戰・換你承受》守住 ${kept}/8 條自己訂的規則，結局是「${$('rank').textContent}」😂 ${location.href}`;try{if(navigator.share){await navigator.share({text:msg});return}await navigator.clipboard.writeText(msg);$('share').textContent='已複製 ✓'}catch(e){if(e.name!=='AbortError')prompt('複製戰績：',msg)}};
</script></body></html>
